name: Ubuntu compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n install.sh scripts/build-gotv-deb.sh scripts/mutter-fix.sh
          bash -n ci/install-check.sh ci/smoke-setup.sh ci/smoke-user.sh

      - name: mutter-fix state overrides
        env:
          OS_REL: /tmp/os-release
        run: |
          set -euo pipefail
          cat > "$OS_REL" <<'EOF'
          ID=ubuntu
          VERSION_ID=24.04
          PRETTY_NAME="Ubuntu 24.04 LTS"
          UBUNTU_CODENAME=noble
          EOF
          s() {
            OS_RELEASE_FILE="$OS_REL" \
            GOTV_MUTTER_VERSION="$1" GOTV_ABI_PACKAGE="$2" \
              bash scripts/mutter-fix.sh status | grep -qx "state: $3"
          }
          s 42.9-0ubuntu9 libmutter-10-0 NOT_NEEDED
          s 46.2-1ubuntu0.24.04.18 libmutter-14-0 NOT_NEEDED
          s 50.1-0ubuntu2.5 libmutter-18-0 NEEDS_PATCH
          s 50.1-0ubuntu2.5+gotv1 libmutter-18-0 APPLIED
          s 50.4-1ubuntu1 libmutter-18-0 FIXED
          echo "mutter-fix state checks: PASS"

  build:
    needs: static
    strategy:
      fail-fast: false
      matrix:
        release: ["22.04", "24.04", "26.04"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test engine on Ubuntu ${{ matrix.release }}
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/dist:/out" \
            -e GOTV_RELEASE=${{ matrix.release }} \
            ubuntu:${{ matrix.release }} bash -c '
              set -e
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                golang-go build-essential pkg-config debhelper \
                libibus-1.0-dev libgtk-3-dev libx11-dev libxtst-dev dpkg-dev
              cd /src
              make test
              bash scripts/build-gotv-deb.sh /out'

      - name: Install check (Ubuntu ${{ matrix.release }})
        run: |
          deb=$(basename "$(ls dist/*.deb | head -1)")
          docker run --rm \
            -v "$PWD/dist:/debs:ro" -v "$PWD/ci:/ci:ro" \
            ubuntu:${{ matrix.release }} bash /ci/install-check.sh "/debs/$deb" | tee install.log
          grep -q INSTALL_OK install.log

      - name: Engine smoke test (Ubuntu ${{ matrix.release }})
        run: |
          deb=$(basename "$(ls dist/*.deb | head -1)")
          docker run --rm \
            -v "$PWD/dist:/debs:ro" -v "$PWD/ci:/ci:ro" \
            ubuntu:${{ matrix.release }} bash /ci/smoke-setup.sh "/debs/$deb" | tee smoke.log
          grep -q SMOKE_OK smoke.log

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: engine-deb-${{ matrix.release }}
          path: dist/*.deb
          if-no-files-found: error
